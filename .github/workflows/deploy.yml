name: Deploy fb-market-selection

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ~/crypto-bot/services/fb-market-selection
            cd ~/crypto-bot/services/fb-market-selection
            
            # Se o diretório não tiver o git iniciado
            if [ ! -d ".git" ]; then
              git clone https://github.com/FinBot-Crypto/fb-market-selection.git .
            else
              git pull origin main
            fi
            
            # Build e Restart do container específico
            # Assumindo que temos um docker-compose.yml na raiz do projeto na VPS
            cd ~/crypto-bot
            docker compose up -d --build market-selection
